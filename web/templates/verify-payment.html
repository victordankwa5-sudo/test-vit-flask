<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Verify Payment</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: Arial, sans-serif;
			background: #f4f7fb;
			color: #1f2937;
		}

		.card {
			width: min(90%, 420px);
			padding: 2.5rem;
			text-align: center;
			background: #fff;
			border-radius: 16px;
			box-shadow: 0 10px 30px rgba(31, 41, 55, 0.1);
		}

		h1 { margin-top: 0; }

		p {
			line-height: 1.6;
			color: #6b7280;
		}

		button {
			margin-top: 1rem;
			padding: 0.85rem 1.5rem;
			border: 0;
			border-radius: 8px;
			background: #2563eb;
			color: #fff;
			font-size: 1rem;
			font-weight: bold;
			cursor: pointer;
		}

		button:hover { background: #1d4ed8; }
	</style>
</head>
<body>
	<main class="card">
		<h1>Payment Completed?</h1>
		<p>If you have completed the payment for your item, click the button below to verify it.</p>
		
		<a href="place-order"><button type="submit">I’ve Completed Payment</button></a>
		</p>
	</main>
</body>
</html>
